<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookSpace | Readers</title>
    <link rel="stylesheet" href="bookshelf.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <div class="header">
            <div class="logo">
                <img src="logo.JPEG" alt="BookSpace Logo">
            </div>
           <nav>
  <ul>
    <li><a href="reader_dashboard.php">Home</a></li>
    <li><a href="bookshelf.html">Bookshelf</a></li>
    <li><a href="cost.html">Cost</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="chatbot.html">AI Chatbot</a></li>
    <li><a href="authors.html">Authors</a></li>
  </ul>
</nav>
            <div class="search-bar">
                <input type="text" placeholder="Search books...">
            </div>
            <div class="menu">
      <span class="more">☰</span>
    </div>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Genres</h3>
            <label><input type="checkbox"> Fantasy</label>
            <label><input type="checkbox"> Sci-Fi</label>
            <label><input type="checkbox"> History</label>
            <label><input type="checkbox"> Cookbooks</label>

            <h3>Authors</h3>
            <label><input type="checkbox"> Khaled Hosseini</label>
            <label><input type="checkbox"> Dan Brown</label>

            <h3>Rating</h3>
            <label><input type="checkbox"> 4★ & above</label>
            <label><input type="checkbox"> 3★ & above</label>
        </aside>

        <!-- Bookshelf -->
        <main class="bookshelf">
            <h2>Explore the Bookshelf</h2>
            <div class="book-grid" id="bookGrid">
                <!-- Example Book Cards -->
                <div class="book-card">
                    <img src="https://covers.openlibrary.org/b/id/8228691-L.jpg" alt="Book">
                    <div class="book-title">The Kite Runner</div>
                    <div class="book-author">Khaled Hosseini</div>
                    <div class="book-rating">⭐ 4.5</div>
                    <button class="summary-btn">AI Summary</button>
                </div>

                <div class="book-card">
                    <img src="https://covers.openlibrary.org/b/id/10594740-L.jpg" alt="Book">
                    <div class="book-title">Infernal Devices</div>
                    <div class="book-author">K.W. Jeter</div>
                    <div class="book-rating">⭐ 4.0</div>
                    <button class="summary-btn">AI Summary</button>
                </div>
            </div>

            <!-- Add Book Form -->
            <div class="add-book-form">
                <h3>Add Your Book</h3>
                <form id="addBookForm">
                    <input type="text" id="title" name="title" placeholder="Book Title" required>
                    <input type="text" id="author" name="author" placeholder="Author Name" required>
                    <input type="number" step="0.1" min="0" max="5" id="rating" name="rating" placeholder="Rating (0-5)" required>
                    <input type="text" id="cover" name="cover" placeholder="Cover Image URL" required>
                    <button type="submit">Add Book</button>
                </form>
            </div>
        </main>
    </div>

    <script>
document.getElementById("bookForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let formData = new FormData(this);

    fetch("http://localhost/BookSpace_project/api/books.php", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        console.log(data);
        if (data.status === "success") {
            alert("Book added successfully!");
        } else {
            alert("Error: " + data.error);
        }
    })
    .catch(err => console.error(err));
});
document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);

    const title = params.get("title");
    const author = params.get("author");
    const rating = params.get("rating");
    const cover = params.get("cover");

    if (title && author && rating && cover) {
        const bookshelf = document.querySelector(".bookshelf"); // your container for books

        const bookCard = document.createElement("div");
        bookCard.classList.add("book-card");

        bookCard.innerHTML = `
            <img src="${cover}" alt="${title}">
            <h4>${title}</h4>
            <p>${author}</p>
            <div class="rating">⭐ ${rating}</div>
            <button class="ai-summary">AI Summary</button>
            <button class="delete-book">Delete</button>
        `;

        bookshelf.appendChild(bookCard);

        // delete button functionality
        bookCard.querySelector(".delete-book").addEventListener("click", () => {
            bookCard.remove();
        });
    }
});
</script>

</body>
</html>
